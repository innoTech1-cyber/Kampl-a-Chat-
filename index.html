<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KAMP'L A CHAT by Inno</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system}
body{background:#111b21;color:#e9edef;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#login{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;background:#111b21}
#login h1{color:#25d366;font-size:32px;margin-bottom:8px}
#login input{width:90%;max-width:320px;padding:14px;border-radius:8px;border:none;background:#202c33;color:white;margin:8px;text-align:center;font-size:16px}
#login button{width:90%;max-width:320px;padding:14px;border-radius:8px;border:none;background:#25d366;color:#111b21;font-weight:800;font-size:16px;margin-top:10px}
#app{display:none;flex:1;flex-direction:column;height:100vh}
.top{height:60px;background:#202c33;display:flex;align-items:center;padding:0 12px;justify-content:space-between}
.top b{font-size:19px;color:#e9edef}
.top .icons{display:flex;gap:16px;font-size:20px}
.tabs{display:flex;background:#202c33}
.tab{flex:1;text-align:center;padding:12px 0;font-size:14px;font-weight:700;color:#8696a0;border-bottom:3px solid transparent;cursor:pointer}.tab.on{color:#25d366;border-color:#25d366}
.pages{flex:1;overflow:hidden;display:flex;flex-direction:column;background:#0b141a}
.page{display:none;flex:1;overflow-y:auto}.page.show{display:flex;flex-direction:column}
.chatItem{padding:12px 14px;display:flex;gap:12px;border-bottom:1px solid #222d34;cursor:pointer;background:#111b21}
.chatItem:active{background:#202c33}
.avatar{width:48px;height:48px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;font-weight:800;color:#111b21;flex-shrink:0}
.chatInfo{flex:1;overflow:hidden}
.chatInfo .name{font-weight:600;font-size:16px;display:flex;justify-content:space-between}
.chatInfo .last{font-size:13px;color:#8696a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
#chatView{display:none;flex:1;flex-direction:column;height:100vh;background:#0b141a}
#chatHeader{height:60px;background:#202c33;display:flex;align-items:center;padding:0 12px;gap:12px}
#messages{flex:1;overflow-y:auto;padding:12px;background:url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');background-size:contain}
.bubble{max-width:78%;padding:8px 10px;border-radius:8px;margin:4px 0;font-size:14.5px;line-height:19px;position:relative;word-wrap:break-word}
.me{background:#005c4b;margin-left:auto;border-top-right-radius:0}
.them{background:#202c33;margin-right:auto;border-top-left-radius:0}
.bubble .meta{font-size:10px;color:#8696a0;text-align:right;margin-top:4px;display:flex;justify-content:flex-end;gap:4px}
.bubble img,.bubble video{max-width:100%;border-radius:6px;margin-top:4px}
.inputBar{display:flex;align-items:flex-end;padding:6px 8px;background:#202c33;gap:6px}
.inputBar .left{background:#2a3942;border-radius:24px;flex:1;display:flex;align-items:flex-end;padding:6px 10px;gap:8px}
.inputBar textarea{flex:1;background:transparent;border:none;color:white;resize:none;max-height:100px;outline:none;font-size:15px;padding:6px}
.inputBar button{width:44px;height:44px;border-radius:50%;border:none;background:#25d366;color:#111b21;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#emojiBox{display:none;flex-wrap:wrap;gap:6px;padding:10px;background:#202c33;max-height:140px;overflow-y:auto}
#emojiBox span{font-size:22px;cursor:pointer;padding:4px}
.fab{position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:#25d366;color:#111b21;font-size:28px;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,0.4)}
.statusItem{padding:12px;display:flex;gap:12px;border-bottom:1px solid #222d34}
</style>
</head>
<body>

<div id="login">
<h1>KAMP'L A CHAT</h1>
<p style="color:#8696a0;margin-bottom:20px">by Inno • WhatsApp Style Full</p>
<input id="u" placeholder="Enter username">
<input id="phone" placeholder="Phone (optional)">
<button onclick="enter()">START CHATTING</button>
<p style="font-size:11px;color:#8696a0;margin-top:20px">All WhatsApp features included</p>
</div>

<div id="app">
<div class="top"><b>KampLa Chat</b><div class="icons"><span onclick="alert('Search')">🔍</span><span onclick="alert('Menu')">⋮</span></div></div>
<div class="tabs">
<div class="tab on" onclick="switchTab('chats',this)">CHATS</div>
<div class="tab" onclick="switchTab('status',this)">STATUS</div>
<div class="tab" onclick="switchTab('calls',this)">CALLS</div>
</div>
<div class="pages">
<div id="p-chats" class="page show"><div id="chatList"></div><button class="fab" onclick="newChat()">💬</button></div>
<div id="p-status" class="page"><div style="padding:12px"><b>My Status</b><div class="statusItem" onclick="postStatus()"><div class="avatar">+</div><div><b>Tap to add status</b><div style="font-size:12px;color:#8696a0">Images from phone</div></div></div><div id="statusList"></div></div></div>
<div id="p-calls" class="page"><div style="padding:30px;text-align:center;color:#8696a0">Calls feature - Voice note replaces calls<br>Hold 🎤 to record</div></div>
</div>
</div>

<div id="chatView">
<div id="chatHeader"><span onclick="closeChat()" style="font-size:22px;cursor:pointer">←</span><div class="avatar" id="chAvatar">A</div><div style="flex:1"><b id="chName">Name</b><div id="chOnline" style="font-size:11px;color:#8696a0">tap to see online</div></div><div style="display:flex;gap:16px;font-size:20px"><span>📞</span><span>📹</span><span>⋮</span></div></div>
<div id="messages"></div>
<div id="typing" style="padding:4px 16px;font-size:12px;color:#25d366;display:none">typing...</div>
<div id="emojiBox"></div>
<div class="inputBar">
<div class="left">
<span onclick="toggleEmoji()" style="font-size:22px;cursor:pointer">😊</span>
<textarea id="msgIn" placeholder="Message" rows="1" oninput="onTyping();autoGrow(this)"></textarea>
<span onclick="document.getElementById('fileIn').click()" style="font-size:20px;cursor:pointer">📎</span>
<span onclick="document.getElementById('imgIn').click()" style="font-size:20px;cursor:pointer">📷</span>
</div>
<button id="sendBtn" onclick="sendMsg()">➤</button>
</div>
<input type="file" id="imgIn" accept="image/*,video/*" style="display:none" onchange="sendFile(this,'media')">
<input type="file" id="fileIn" accept="*/*" style="display:none" onchange="sendFile(this,'doc')">
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyAGzXyxBHmvBcWwoyWo4Xjn_1pGRyQjO_M",authDomain:"hittvapp1-29f3a.firebaseapp.com",databaseURL:"https://hittvapp1-29f3a-default-rtdb.firebaseio.com",projectId:"hittvapp1-29f3a",storageBucket:"hittvapp1-29f3a.firebasestorage.app",messagingSenderId:"567256630691",appId:"1:567256630691:web:5e6e22fe24416eb3270616"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
let me="",curChat="",curChatId="",isGroup=false,replyTo=null,recorder,chunks=[],isRecording=false;
const emojis=["😀","😂","😍","😘","😎","😭","😡","👍","❤️","🔥","🎉","🙏","😅","🥺","🤔","👏","💯","🤣","😊","🥰","😇","🤩","😋","🤗","🤫","🤭","😏","😴","🤤","😷","🤒","🤕","🤑","🤠","😈","👻","👋","✋","🙌","👌","✌️","🤞","🤟","🤘","🤙","👈","👉","👆","🖕"];

function enter(){me=document.getElementById('u').value.trim();if(!me)return alert("Enter username");localStorage.setItem("kampla_me",me);document.getElementById('login').style.display='none';document.getElementById('app').style.display='flex';db.ref("kampla_users/"+me).set({name:me,online:true,last:Date.now()});loadChats();setupEmoji();window.addEventListener('beforeunload',()=>{db.ref("kampla_users/"+me).update({online:false,last:Date.now()})});}
function switchTab(p,el){document.querySelectorAll('.page').forEach(e=>e.classList.remove('show'));document.querySelectorAll('.tab').forEach(e=>e.classList.remove('on'));document.getElementById('p-'+p).classList.add('show');el.classList.add('on');}
function setupEmoji(){let b=document.getElementById('emojiBox');emojis.forEach(e=>{let s=document.createElement('span');s.innerText=e;s.onclick=()=>{document.getElementById('msgIn').value+=e;};b.appendChild(s);});}
function toggleEmoji(){let b=document.getElementById('emojiBox');b.style.display=b.style.display=='flex'?'none':'flex';}
function autoGrow(el){el.style.height='auto';el.style.height=el.scrollHeight+'px';}
function newChat(){let name=prompt("Enter username to chat with:");if(!name||name==me)return;let id=[me,name].sort().join("_");db.ref("kampla_chats/"+id).update({users:[me,name],last:"",time:Date.now(),type:"private"});openChat(id,name,false);}
function loadChats(){db.ref("kampla_chats").on("value",s=>{let h="";s.forEach(x=>{let d=x.val();if(!d.users||!d.users.includes(me))return;let other=d.users.find(u=>u!=me)||d.name||"Group";let name=isGroupName(d)?d.name:other;h+=`<div class="chatItem" onclick="openChat('${x.key}','${name}',${d.type=='group'})"><div class="avatar">${name[0].toUpperCase()}</div><div class="chatInfo"><div class="name"><span>${name}</span><span style="font-size:11px;color:#8696a0">${d.time?new Date(d.time).toLocaleTimeString():''}</span></div><div class="last">${d.last||'Tap to start chatting - all WhatsApp features'}</div></div></div>`;});document.getElementById('chatList').innerHTML=h||"<div style='padding:30px;text-align:center;color:#8696a0'>No chats yet<br>Tap 💬 to start new chat</div>";});db.ref("kampla_status").on("value",s=>{let h="";s.forEach(x=>{let d=x.val();h+=`<div class="statusItem"><div class="avatar">${d.user[0]}</div><div><b>${d.user}</b><div style="font-size:11px">${new Date(d.time).toLocaleTimeString()}</div></div><img src="${d.url}" style="width:50px;height:50px;border-radius:8px;margin-left:auto;object-fit:cover"></div>`;});document.getElementById('statusList').innerHTML=h;});}
function isGroupName(d){return d.type=='group';}
function openChat(id,name,group){curChatId=id;curChat=name;isGroup=group;document.getElementById('app').style.display='none';document.getElementById('chatView').style.display='flex';document.getElementById('chName').innerText=name;document.getElementById('chAvatar').innerText=name[0].toUpperCase();document.getElementById('messages').innerHTML="";db.ref("kampla_users/"+name).on("value",sn=>{let u=sn.val();if(u){document.getElementById('chOnline').innerText=u.online?"online": "last seen "+new Date(u.last).toLocaleTimeString();}});db.ref("kampla_messages/"+id).on("value",snap=>{let html="";snap.forEach(m=>{let d=m.val();let mine=d.from==me;let tick=d.read?"✓✓":d.delivered?"✓✓":"✓";html+=`<div class="bubble ${mine?'me':'them'}" onclick="msgMenu('${m.key}',${mine})">${d.reply?`<div style="border-left:3px solid #25d366;padding-left:6px;margin-bottom:4px;opacity:0.8;font-size:12px">${d.reply}</div>`:''}${d.type=='text'?`${esc(d.text)}`:''}${d.type=='media'?`${d.url.includes('video')?`<video src="${d.url}" controls></video>`:`<img src="${d.url}">`}<div style="font-size:12px">${esc(d.text||'')}</div>`:''}${d.type=='doc'?`<div>📄 <a href="${d.url}" download style="color:#53bdeb">${d.name||'Document'}</a></div>`:''}${d.type=='voice'?`<audio src="${d.url}" controls style="width:200px"></audio>`:''}<div class="meta"><span>${new Date(d.time).toLocaleTimeString().slice(0,5)}</span><span style="color:${d.read?'#53bdeb':'#8696a0'}">${mine?tick:''}</span></div></div>`;});document.getElementById('messages').innerHTML=html;document.getElementById('messages').scrollTop=document.getElementById('messages').scrollHeight;if(snap.size>0){let lastKey=Object.keys(snap.val()).pop();db.ref("kampla_messages/"+id+"/"+lastKey).update({delivered:true});setTimeout(()=>{if(document.getElementById('chatView').style.display!='none')db.ref("kampla_messages/"+id+"/"+lastKey).update({read:true});},1000);}});db.ref("kampla_typing/"+id+"/"+name).on("value",v=>{document.getElementById('typing').style.display=v.val()?"block":"none";});}
function closeChat(){document.getElementById('chatView').style.display='none';document.getElementById('app').style.display='flex';curChatId="";db.ref("kampla_typing/"+curChatId+"/"+me).remove();}
function esc(t){return t.replace(/</g,'&lt;');}
function sendMsg(){let txt=document.getElementById('msgIn').value.trim();if(!txt)return;let payload={from:me,to:curChat,text:txt,type:"text",time:Date.now(),delivered:false,read:false,reply:replyTo||""};db.ref("kampla_messages/"+curChatId).push(payload);db.ref("kampla_chats/"+curChatId).update({last:txt,time:Date.now()});document.getElementById('msgIn').value="";replyTo=null;document.getElementById('msgIn').style.height='auto';db.ref("kampla_typing/"+curChatId+"/"+me).remove();}
function onTyping(){db.ref("kampla_typing/"+curChatId+"/"+me).set(true);clearTimeout(window._tt);window._tt=setTimeout(()=>{db.ref("kampla_typing/"+curChatId+"/"+me).remove();},2000);}
function sendFile(input,type){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{let payload={from:me,to:curChat,text:f.name,type:type=='media'?'media':'doc',url:e.target.result,name:f.name,time:Date.now(),delivered:false,read:false};db.ref("kampla_messages/"+curChatId).push(payload);db.ref("kampla_chats/"+curChatId).update({last:"📎 "+f.name,time:Date.now()});};r.readAsDataURL(f);input.value="";}
function msgMenu(key,mine){let act=prompt("Reply / Delete? Type: reply or delete");if(!act)return;if(act.toLowerCase()=='delete'&&mine){db.ref("kampla_messages/"+curChatId+"/"+key).remove();}else if(act.toLowerCase().startsWith('reply')){let t=prompt("Reply text:");if(t){replyTo=t;document.getElementById('msgIn').focus();document.getElementById('msgIn').placeholder="Replying to: "+t;}}}
function postStatus(){let inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=()=>{let f=inp.files[0];let r=new FileReader();r.onload=e=>{db.ref("kampla_status").push({user:me,url:e.target.result,time:Date.now()});alert("Status posted!");};r.readAsDataURL(f);};inp.click();}
document.getElementById('sendBtn').addEventListener('mousedown',async(e)=>{if(document.getElementById('msgIn').value.trim()!="")return;if(isRecording)return;try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});recorder=new MediaRecorder(stream);chunks=[];recorder.ondataavailable=ev=>chunks.push(ev.data);recorder.onstop=()=>{let blob=new Blob(chunks,{type:'audio/webm'});let r=new FileReader();r.onload=ev=>{db.ref("kampla_messages/"+curChatId).push({from:me,to:curChat,type:"voice",url:ev.target.result,time:Date.now(),delivered:false,read:false});};r.readAsDataURL(blob);};recorder.start();isRecording=true;document.getElementById('sendBtn').innerText="■";setTimeout(()=>{if(isRecording){recorder.stop();isRecording=false;document.getElementById('sendBtn').innerText="➤";}},8000);}catch(err){}});document.getElementById('sendBtn').addEventListener('mouseup',()=>{if(isRecording&&recorder){recorder.stop();isRecording=false;document.getElementById('sendBtn').innerText="➤";}});
window.onload=()=>{let saved=localStorage.getItem("kampla_me");if(saved){document.getElementById('u').value=saved;enter();}};
</script>
</body>
  </html>
