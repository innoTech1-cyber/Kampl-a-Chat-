<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HIT TV by Inno</title>
</head>
<body style="background:#0a1931;color:white;font-family:system-ui;padding:20px;text-align:center">

<h1 style="color:#4da3ff">HIT TV <span style="color:white">by Inno</span></h1>
<p>Loading... If you see this, code is working!</p>

<div id="login" style="margin-top:40px">
<input id="u" placeholder="Enter username" style="padding:14px;border-radius:30px;border:none;width:90%;max-width:300px;text-align:center"><br><br>
<button onclick="goApp()" style="padding:14px 40px;border-radius:30px;border:none;background:#1e5bff;color:white;font-weight:bold">SIGN IN</button>
</div>

<div id="app" style="display:none;margin-top:30px">
<h2>✅ SUCCESS! App is reading!</h2>
<p id="showName"></p>
<video id="vid" controls style="width:100%;max-width:400px;height:220px;background:black;margin-top:20px;border-radius:12px"></video>
<p style="margin-top:20px">Banner will be here below video</p>
<div style="background:#0f2a5a;padding:30px;border-radius:12px;margin-top:10px">BANNER ADS</div>
</div>

<script>
function goApp(){
let name=document.getElementById('u').value;
if(!name){alert("Enter username");return;}
document.getElementById('login').style.display='none';
document.getElementById('app').style.display='block';
document.getElementById('showName').innerText="Welcome: "+name + (name.toLowerCase()=="inno"?" 👑 Owner":"");
}
</script>
</body>
</html>
