<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#04101f" />
<title>Kampl'a Chat</title>
<style>
  /* ============ THEME (DARK BLUE) ============ */
  :root{
    --bg:        #04101f;
    --side:      #081b2e;
    --side-2:    #0b2439;
    --side-hover:#0f2e49;
    --chat-bg:   #061a2c;
    --bubble-me: #14508f;
    --bubble-th: #0e2e4b;
    --accent:    #2f81f7;
    --accent-2:  #1b5fbf;
    --text:      #e8f2ff;
    --muted:     #7fa3c4;
    --line:      #12314f;
    --green:     #25d366;
    --red:       #ff4d5e;
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
    background:var(--bg); color:var(--text);
    height:100dvh; overflow:hidden;
    font-size:15px;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input{font-family:inherit}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#123css;background:#12314f;border-radius:8px}
  ::-webkit-scrollbar-thumb:hover{background:#1b4368}
  ::-webkit-scrollbar-track{background:transparent}

  /* ============ LAYOUT ============ */
  .app{display:flex;height:100dvh;overflow:hidden}

  /* ============ SIDEBAR ============ */
  .sidebar{
    width:380px;min-width:380px;display:flex;flex-direction:column;
    background:var(--side);border-right:1px solid var(--line);
  }
  .side-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px 10px;gap:10px;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .logo{
    width:42px;height:42px;border-radius:14px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--accent),#0a2f66);
    display:grid;place-items:center;font-weight:800;font-size:19px;
    color:#fff;box-shadow:0 4px 14px rgba(47,129,247,.35);
  }
  .brand h1{font-size:17px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
  .brand .sub{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}
  .side-actions{display:flex;gap:4px}

  .icon-btn{
    width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
    font-size:17px;color:var(--muted);transition:.18s;flex:0 0 auto;
  }
  .icon-btn:hover{background:var(--side-hover);color:var(--text)}

  /* Tabs */
  .tabs{display:flex;padding:0 12px;gap:6px;border-bottom:1px solid var(--line)}
  .tab{
    flex:1;padding:11px 4px;font-size:13.5px;font-weight:600;color:var(--muted);
    border-bottom:2px solid transparent;transition:.18s;
  }
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}

  /* Search */
  .search-wrap{
    margin:12px 14px;display:flex;align-items:center;gap:8px;
    background:var(--side-2);border:1px solid var(--line);
    border-radius:22px;padding:9px 14px;
  }
  .search-wrap span{font-size:13px;opacity:.7}
  .search-wrap input{
    flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14px;
  }
  .search-wrap input::placeholder{color:var(--muted)}

  .scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:16px}
  .hidden{display:none !important}

  /* Status circles row */
  .status-row{
    display:flex;gap:14px;padding:4px 16px 14px;overflow-x:auto;border-bottom:1px solid var(--line);
  }
  .status-row::-webkit-scrollbar{display:none}
  .story{display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 0 auto;width:64px}
  .story .ring{
    width:56px;height:56px;border-radius:50%;padding:2.5px;
    background:conic-gradient(var(--accent) 0 70%, #0a2f66 70% 100%);
    display:grid;place-items:center;transition:.2s;
  }
  .story:hover .ring{transform:scale(1.05)}
  .story .ring.me{background:var(--side-2);border:1px dashed var(--accent)}
  .story .av{
    width:100%;height:100%;border-radius:50%;display:grid;place-items:center;
    font-weight:700;font-size:17px;color:#fff;border:3px solid var(--side);
  }
  .story small{font-size:11px;color:var(--muted);text-align:center;max-width:64px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* Chat list */
  .chat-list{display:flex;flex-direction:column}
  .chat-item{
    display:flex;align-items:center;gap:12px;padding:11px 16px;cursor:pointer;
    transition:.15s;border-left:3px solid transparent;
  }
  .chat-item:hover{background:var(--side-2)}
  .chat-item.active{background:var(--side-hover);border-left-color:var(--accent)}
  .avatar{
    width:50px;height:50px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
    font-weight:700;font-size:18px;color:#fff;position:relative;
  }

    position:absolute;right:1px;bottom:1px;width:12px;height:12px;border-radius:50%;
