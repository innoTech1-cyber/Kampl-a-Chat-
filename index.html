<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAMPL'A CHAT </title>
<link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiS0FNUExBIE1DSEFUIE0zIiwic2hvcnRfbmFtZSI6IkthbXBsYSIsImRpc3BsYXkiOiJzdGFuZGFsb25lIiwiYmFja2dyb3VuZF9jb2xvciI6IiMwYTE5MzEiLCJ0aGVtZV9jb2xvciI6IiMxZTViZmYifQ==">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0a1931;color:white;height:100vh;display:flex;flex-direction:column}
header{background:#0f2a5a;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #1e5bff}
.tabs{display:flex;background:#0f2a5a;padding:5px;gap:5px}
.tab{flex:1;padding:12px;text-align:center;background:#11264f;border-radius:10px;cursor:pointer;font-weight:700}
.tab.active{background:#1e5bff}
#loginBox{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;background:linear-gradient(180deg,#0a1931,#122a5c)}
#loginBox input{width:90%;max-width:320px;padding:14px;border-radius:30px;border:none;margin:10px;background:#162d5e;color:white;text-align:center;font-size:16px}
#loginBox button{width:90%;max-width:320px;padding:14px;border-radius:30px;border:none;background:#1e5bff;color:white;font-weight:800;margin-top:10px}
#app{display:none;flex:1;flex-direction:column;overflow:hidden}
.list{flex:1;overflow-y:auto;padding:10px;display:none}.list.active{display:block}
.user{padding:14px;background:#11264f;margin:6px 0;border-radius:12px;display:flex;justify-content:space-between;cursor:pointer;border:1px solid #1a3a6e}
.group-card{background:linear-gradient(90deg,#1e5bff,#4da3ff);padding:16px;border-radius:14px;margin:10px;cursor:pointer;font-weight:800;display:flex;justify-content:space-between}
#chatWin{display:none;flex:1;flex-direction:column;background:#08142b}
#chatHeader{background:#0f2a5a;padding:10px;display:flex;align-items:center;gap:10px}
#chatHeader button{background:#1e5bff;border:none;color:white;padding:8px 14px;border-radius:20px}
#msgs{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:82%;padding:10px 14px;border-radius:18px;font-size:15px;position:relative;word-break:break-word}
.me{align-self:flex-end;background:#1e5bff;border-bottom-right-radius:4px}
.other{align-self:flex-start;background:#162d5e;border-bottom-left-radius:4px}
.msg img{max-width:100%;border-radius:10px;margin-top:5px}
.msg audio{width:200px;margin-top:5px}
#sendBar{display:flex;padding:8px;background:#0f2a5a;gap:6px;align-items:center}
#sendBar input{flex:1;padding:12px;border-radius:30px;border:none;background:#162d5e;color:white;outline:none}
.iconBtn{width:42px;height:42px;border-radius:50%;border:none;background:#11264f;color:white;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#sendBtn{background:#1e5bff;width:46px;height:46px;border-radius:50%;border:none;color:white;font-weight:800;cursor:pointer}
small{opacity:0.7;font-size:11px;display:block;margin-top:4px}
.del{font-size:10px;color:#ff8a8a;cursor:pointer;margin-left:8px}
#typing{font-size:12px;color:#4da3ff;padding:0 15px;height:18px}
#emojiBox{display:none;flex-wrap:wrap;background:#11264f;padding:8px;gap:5px;max-height:120px;overflow-y:auto}
#emojiBox span{font-size:22px;cursor:pointer;padding:4px}
</style>
</head>
<body>
<header><h1>KAMPL'A <span style="color:#4da3ff">CHAT V3</span></h1><div id="myName"></div></header>
<div id="loginBox"><h2 style="color:#7db4ff">KAMPL'A V3</h2><p style="opacity:0.7;margin:8px 0 20px;text-align:center">📸 Images • 🎤 Voice • ✅ Ticks • Installable</p><input id="username" placeholder="Enter name e.g. Inno"><button onclick="login()">START</button><button onclick="installApp()" id="installBtn" style="background:#11264f;margin-top:10px;display:none">📲 Install App</button></div>
<div id="app">
<div class="tabs"><div class="tab active" id="tabGroup" onclick="showTab('group')">🌍 Group</div><div class="tab" id="tabPrivate" onclick="showTab('private')">👥 Private</div></div>
<div id="listGroup" class="list active"><div class="group-card" onclick="openGroup()"><span>🔥 KAMPL'A VILLAGE GROUP</span><span id="onlineCount">0 online</span></div></div>
<div id="listPrivate" class="list"><div id="users"></div></div>
<div id="chatWin"><div id="chatHeader"><button onclick="closeChat()">←</button><div><b id="chatWith"></b><br><small id="statusTxt"></small></div></div><div id="msgs"></div><div id="typing"></div><div id="emojiBox"></div><div id="sendBar"><button class="iconBtn" onclick="toggleEmoji()">😊</button><label class="iconBtn" style="cursor:pointer">📸<input type="file" id="imgFile" accept="image/*" hidden onchange="sendImage(this)"></label><input id="msgInput" placeholder="Type..." oninput="typing()" onkeypress="if(event.key==='Enter')sendMsg()"><button class="iconBtn" onclick="startVoice()" id="voiceBtn">🎤</button><button id="sendBtn" onclick="sendMsg()">➤</button></div></div>
</div>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {apiKey:"AIzaSyAGzXyxBHmvBcWwoyWo4Xjn_1pGRyQjO_M",authDomain:"hittvapp1-29f3a.firebaseapp.com",databaseURL:"https://hittvapp1-29f3a-default-rtdb.firebaseio.com",projectId:"hittvapp1-29f3a",storageBucket:"hittvapp1-29f3a.firebasestorage.app",messagingSenderId:"567256630691",appId:"1:567256630691:web:5e6e22fe24416eb3270616"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
let me="",currentChat="",isGroup=false,deferredPrompt=null;let recorder,chunks=[];
const emojis=["😀","😂","😍","🔥","❤️","👍","🙏","💯","😎","🎉","🥰","😭","👏","✨","⚡","🌍","🇺🇬","💬"];
document.getElementById('emojiBox').innerHTML=emojis.map(e=>`<span onclick="addEmoji('${e}')">${e}</span>`).join('');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBtn').style.display='block';});
function installApp(){if(deferredPrompt)deferredPrompt.prompt();}
function addEmoji(e){document.getElementById('msgInput').value+=e;toggleEmoji();}
function toggleEmoji(){let b=document.getElementById('emojiBox');b.style.display=b.style.display==='flex'?'none':'flex';}
function login(){me=document.getElementById('username').value.trim();if(!me)return alert("Name!");document.getElementById('loginBox').style.display='none';document.getElementById('app').style.display='flex';document.getElementById('myName').innerText=me;db.ref("kampla_users/"+me).set({online:true,lastSeen:Date.now(),name:me});loadUsers();db.ref("kampla_users").on("value",s=>document.getElementById('onlineCount').innerText=s.numChildren()+" online");window.onbeforeunload=()=>db.ref("kampla_users/"+me).update({online:false,lastSeen:Date.now()});}
function showTab(t){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.list').forEach(x=>x.classList.remove('active'));if(t==='group'){document.getElementById('tabGroup').classList.add('active');document.getElementById('listGroup').classList.add('active');}else{document.getElementById('tabPrivate').classList.add('active');document.getElementById('listPrivate').classList.add('active');}}
function loadUsers(){db.ref("kampla_users").on("value",snap=>{let h="";snap.forEach(u=>{if(u.key!==me){let d=u.val();h+=`<div class="user" onclick="openChat('${u.key}')"><div><b>${u.key}</b><br><small style="color:${d.online?'#4dff88':'#888'}">${d.online?'● online':'○ '+new Date(d.lastSeen).toLocaleTimeString()}</small></div><span>💬</span></div>`;}});document.getElementById('users').innerHTML=h;});}
function openGroup(){isGroup=true;currentChat="GROUP";document.querySelector('.tabs').style.display='none';document.getElementById('listGroup').classList.remove('active');document.getElementById('listPrivate').classList.remove('active');document.getElementById('chatWin').style.display='flex';document.getElementById('chatWith').innerText="🌍 KAMPL'A VILLAGE GROUP";document.getElementById('statusTxt').innerText="Group • Tap to send images/voice";listenGroup();}
function openChat(u){isGroup=false;currentChat=u;document.querySelector('.tabs').style.display='none';document.getElementById('listGroup').classList.remove('active');document.getElementById('listPrivate').classList.remove('active');document.getElementById('chatWin').style.display='flex';document.getElementById('chatWith').innerText=u;db.ref("kampla_users/"+u).on("value",s=>{let d=s.val();if(d)document.getElementById('statusTxt').innerText=d.online?'online • typing...':"last seen "+new Date(d.lastSeen).toLocaleString();});listenPrivate();}
function closeChat(){document.getElementById('chatWin').style.display='none';document.querySelector('.tabs').style.display='flex';showTab('group');}
function renderMsg(d,key,path){let cls=d.from===me?"me":"other";let canDel=d.from===me||me==="Inno";let del=`<span class="del" onclick="delMsg('${path}','${key}')">🗑️</span>`;let img=d.image?`<br><img src="${d.image}">`:'';let aud=d.audio?`<br><audio controls src="${d.audio}"></audio>`:'';let ticks=d.from===me?' ✓✓':'';return `<div class="msg ${cls}">${d.from!==me&&isGroup?'<b style="font-size:11px;color:#4da3ff">'+d.from+'</b><br>':''}${d.text||''}${img}${aud}<small>${d.from} • ${new Date(d.time).toLocaleTimeString()}${ticks} ${canDel?del:''}</small></div>`;}
function listenGroup(){db.ref("kampla_group_msgs").on("value",snap=>{let h="";snap.forEach(m=>{h+=renderMsg(m.val(),m.key,"kampla_group_msgs");});document.getElementById('msgs').innerHTML=h;document.getElementById('msgs').scrollTop=99999;});}
function listenPrivate(){let chatId=[me,currentChat].sort().join("_");db.ref("kampla_msgs/"+chatId).on("value",snap=>{let h="";snap.forEach(m=>{h+=renderMsg(m.val(),m.key,"kampla_msgs/"+chatId);});document.getElementById('msgs').innerHTML=h;document.getElementById('msgs').scrollTop=99999;});}
function sendMsg(){let t=document.getElementById('msgInput').value.trim();if(!t||!currentChat)return;let data={from:me,text:t,time:Date.now()};if(isGroup)db.ref("kampla_group_msgs").push(data);else{let chatId=[me,currentChat].sort().join("_");db.ref("kampla_msgs/"+chatId).push(data);}document.getElementById('msgInput').value="";db.ref("kampla_typing/"+currentChat).set(""); }
function sendImage(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{let data={from:me,text:"📸 Image",image:e.target.result,time:Date.now()};if(isGroup)db.ref("kampla_group_msgs").push(data);else{let chatId=[me,currentChat].sort().join("_");db.ref("kampla_msgs/"+chatId).push(data);}};r.readAsDataURL(f);}
function delMsg(path,key){if(confirm("Delete?"))db.ref(path+"/"+key).remove();}
function typing(){db.ref("kampla_typing/"+me).set(me+" typing...");setTimeout(()=>db.ref("kampla_typing/"+me).remove(),1500);}
db.ref("kampla_typing").on("value",snap=>{let t="";snap.forEach(s=>{if(s.key!==me)t+=s.val()+" ";});document.getElementById('typing').innerText=t;});
async function startVoice(){let btn=document.getElementById('voiceBtn');if(recorder&&recorder.state==="recording"){recorder.stop();btn.innerText="🎤";return;}let stream=await navigator.mediaDevices.getUserMedia({audio:true});recorder=new MediaRecorder(stream);chunks=[];recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{let blob=new Blob(chunks,{type:'audio/webm'});let r=new FileReader();r.onload=e=>{let data={from:me,audio:e.target.result,text:"🎤 Voice",time:Date.now()};if(isGroup)db.ref("kampla_group_msgs").push(data);else{let chatId=[me,currentChat].sort().join("_");db.ref("kampla_msgs/"+chatId).push(data);}};r.readAsDataURL(blob);};recorder.start();btn.innerText="⏹️";}
</script>
</body>
  </html>
